services:
  metrics-server:
    build: ./cmd/modelsvr
    ports:
      - "9200:9200"
    environment:
      - BERTSCORE_MODEL=roberta-large
      - TRANSFORMERS_CACHE=/models
      - PORT=9200
    volumes:
      - model-cache:/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  reranker:
    image: dheaps/local-reranker:latest
    ports:
      - "8010:8010"

volumes:
  model-cache:
